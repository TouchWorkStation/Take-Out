<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e2e">
  <title>Takeout · pair</title>
  <link rel="icon" href="/icon.svg">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #1e1e2e; color: #cdd6f4; font-family: ui-monospace, Menlo, monospace; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: 100%; max-width: 360px; }
    h1 { font-size: 20px; margin: 0 0 6px; display: flex; gap: 10px; align-items: center; }
    p { color: #a6adc8; font-size: 13px; line-height: 1.6; margin: 0 0 22px; }
    code { background: #313244; padding: 2px 6px; border-radius: 5px; color: #89b4fa; }
    input { width: 100%; box-sizing: border-box; padding: 13px 14px; border-radius: 10px; border: 1px solid #45475a; background: #181825; color: inherit; font: inherit; font-size: 15px; }
    input:focus { outline: 2px solid #89b4fa; outline-offset: 1px; }
    button { margin-top: 12px; width: 100%; padding: 13px; border-radius: 10px; border: 0; background: #89b4fa; color: #1e1e2e; font: inherit; font-weight: 700; font-size: 15px; }
    .bad { color: #f38ba8; font-size: 13px; margin: 0 0 12px; display: none; }
  </style>
</head>
<body>
  <main>
    <h1>🥡 takeout</h1>
    <p>Run <code>takeout pair</code> on your Omarchy machine and open the link it prints — or paste the token here.</p>
    <div class="bad" id="bad">That token didn’t match.</div>
    <form method="post" action="/login">
      <input name="token" placeholder="pairing token" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <button type="submit">Pair this device</button>
    </form>
  </main>
  <script>if (location.search.includes('bad=1')) document.getElementById('bad').style.display = 'block';</script>
</body>
</html>
